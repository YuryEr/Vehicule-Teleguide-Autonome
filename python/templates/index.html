<!--
    Interface web de contrôle - Véhicule téléguidé autonome
    PFE ÉTS - Été 2026
    Onglet Pilotage : joystick, caméra, LEDs
    Onglet Programmation : blocs Blockly (mode programmé)
-->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrôle Véhicule Téléguidé</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="header">
        <h1 class="titre">Véhicule Téléguidé</h1>
        <!-- Barre d'onglets -->
        <div class="onglets">
            <button class="onglet onglet-actif" id="btnOngletPilotage"
                    onclick="afficherOnglet('pilotage')">Pilotage</button>
            <button class="onglet" id="btnOngletBlocs"
                    onclick="afficherOnglet('blocs')">Programmation</button>
        </div>
    </div>

    <div id="error-container" class="error-message" style="display: none;"></div>

    <!-- ================================================================
         ONGLET 1 : PILOTAGE MANUEL
    ================================================================ -->
    <div id="ongletPilotage" class="main-content">

        <!-- COLONNE GAUCHE -->
        <div class="colonne-gauche">

            <div class="container">
                <h2 class="section-titre">MODE DE CONDUITE</h2>
                <div class="mode-actuel-badge" id="modeBadge">MANUEL</div>
                <button class="btn-mode" onclick="changerMode()">Changer de mode</button>
            </div>

            <div class="container">
                <h2 class="section-titre">CAMÉRA</h2>
                <div class="camera-statut">
                    <span class="indicateur-on" id="indicateurCamera">●</span>
                    <span id="texteCamera">Active</span>
                </div>
                <button class="btn-camera btn-camera-off" id="btnCamera" onclick="toggleCamera()">
                    Éteindre la caméra
                </button>
            </div>

            <div class="container">
                <h2 class="section-titre">LED BANDEAU 1</h2>
                <div class="camera-statut">
                    <span class="indicateur-off" id="indicateurLed1">●</span>
                    <span id="texteLed1">Éteint</span>
                </div>
                <button class="btn-camera btn-camera-on" id="btnOnoffLed1" onclick="toggleOnoffLed(1)">
                    Allumer
                </button>
                <div class="mode-actuel-badge mode-led-gyrophare" id="badgeLed1">GYROPHARE</div>
                <button class="btn-mode" id="btnModeLed1" onclick="changerModeLed(1)">
                    Changer mode
                </button>
            </div>

            <div class="container">
                <h2 class="section-titre">LED BANDEAU 2</h2>
                <div class="camera-statut">
                    <span class="indicateur-off" id="indicateurLed2">●</span>
                    <span id="texteLed2">Éteint</span>
                </div>
                <button class="btn-camera btn-camera-on" id="btnOnoffLed2" onclick="toggleOnoffLed(2)">
                    Allumer
                </button>
                <div class="mode-actuel-badge mode-led-gyrophare" id="badgeLed2">GYROPHARE</div>
                <button class="btn-mode" id="btnModeLed2" onclick="changerModeLed(2)">
                    Changer mode
                </button>
            </div>

        </div>

        <!-- CENTRE : Vidéo -->
        <div class="container container-video">
            <div id="videoFeedContainer">
                <div id="videoPlaceholder" class="camera-status">
                    <p class="feedback-text">Connexion à la caméra...</p>
                </div>
                <img id="videoStream"
                     src=""
                     style="display: none; width: 100%; border-radius: 8px;"
                     alt="Flux vidéo">
            </div>
        </div>

        <!-- COLONNE DROITE : Joystick -->
        <div class="colonne-droite">
            <div class="container container-joystick">
                <h2 class="section-titre">DIRECTION</h2>
                <div class="joystick-zone" id="joystickZone">
                    <div class="joystick-base">
                        <div class="joystick-poignee" id="joystickPoignee"></div>
                    </div>
                </div>
                <div class="joystick-valeurs" id="joystickValeurs">x: 0.00 | y: 0.00</div>
            </div>
        </div>

    </div>

    <!-- ================================================================
         ONGLET 2 : PROGRAMMATION PAR BLOCS
    ================================================================ -->
    <div id="ongletBlocs" class="main-content-blocs" style="display: none;">

        <div class="container container-blockly">
            <div id="blocklyDiv"></div>
        </div>

        <div class="container panneau-sequence">
            <h2 class="section-titre">EXÉCUTION</h2>
            <div class="sequence-statut" id="sequenceStatut">Prêt</div>
            <button class="btn-executer" id="btnExecuter" onclick="executerBlocs()">
                ▶ Exécuter
            </button>
            <button class="btn-stop" id="btnStop" onclick="stopSequence()" disabled>
                ■ Stop
            </button>
            <button class="btn-effacer" onclick="effacerBlocs()">
                Effacer tout
            </button>
        </div>

    </div>

    <!-- Toolbox Blockly (blocs disponibles) -->
    <xml id="toolbox" style="display: none">
        <block type="avancer"></block>
        <block type="reculer"></block>
        <block type="tourner_gauche"></block>
        <block type="tourner_droite"></block>
        <block type="led_allumer"></block>
        <block type="led_eteindre"></block>
        <block type="attendre"></block>
    </xml>

    <!-- ================================================================
         SCRIPTS
    ================================================================ -->
    <script src="{{ url_for('static', filename='libs/socket.io.min.js') }}"></script>
    <script src="{{ url_for('static', filename='libs/blockly/blockly_compressed.js') }}"></script>
    <script src="{{ url_for('static', filename='libs/blockly/blocks_compressed.js') }}"></script>
    <script src="{{ url_for('static', filename='libs/blockly/fr.js') }}"></script>
    <script>

    // ----------------------------------------------------------------
    // SOCKET.IO
    // ----------------------------------------------------------------
    const socket = io();
    const errorContainer = document.getElementById('error-container');

    socket.on('connect', () => {
        if (errorContainer) errorContainer.style.display = 'none';
    });

    socket.on('disconnect', () => {
        if (errorContainer) {
            errorContainer.textContent = 'Connexion perdue. Vérifiez la connexion au véhicule.';
            errorContainer.style.display = 'block';
        }
    });

    socket.on('mode_actuel', (data) => mettreAJourAffichageMode(data.mode));
    socket.on('etat_camera', (data) => mettreAJourAffichageCamera(data.active));
    socket.on('etat_led1',   (data) => mettreAJourAffichageLed(1, data.active, data.mode));
    socket.on('etat_led2',   (data) => mettreAJourAffichageLed(2, data.active, data.mode));


    // ----------------------------------------------------------------
    // GESTION DES ONGLETS
    // ----------------------------------------------------------------
    let workspaceInitialise = false;

    function afficherOnglet(nom) {
        const pilotage  = document.getElementById('ongletPilotage');
        const blocs     = document.getElementById('ongletBlocs');
        const btnPilot  = document.getElementById('btnOngletPilotage');
        const btnBlocs  = document.getElementById('btnOngletBlocs');

        if (nom === 'pilotage') {
            pilotage.style.display = 'flex';
            blocs.style.display    = 'none';
            btnPilot.classList.add('onglet-actif');
            btnBlocs.classList.remove('onglet-actif');
        } else {
            pilotage.style.display = 'none';
            blocs.style.display    = 'flex';
            btnBlocs.classList.add('onglet-actif');
            btnPilot.classList.remove('onglet-actif');
            // Blockly doit être redimensionné quand son div devient visible
            if (workspaceInitialise) {
                Blockly.svgResize(workspace);
            }
        }
    }


    // ----------------------------------------------------------------
    // BLOCKLY — Définition des blocs personnalisés
    // ----------------------------------------------------------------
    let workspace = null;

    if (typeof Blockly !== 'undefined') {

        // Bloc : avancer de X mètres
        Blockly.Blocks['avancer'] = {
            init: function() {
                this.appendDummyInput()
                    .appendField("avancer de")
                    .appendField(new Blockly.FieldNumber(1, 0.1, 10, 0.1), "VALEUR")
                    .appendField("m");
                this.setPreviousStatement(true);
                this.setNextStatement(true);
                this.setColour(180);
                this.setTooltip("Le véhicule avance de la distance indiquée");
            }
        };

        // Bloc : reculer de X mètres
        Blockly.Blocks['reculer'] = {
            init: function() {
                this.appendDummyInput()
                    .appendField("reculer de")
                    .appendField(new Blockly.FieldNumber(1, 0.1, 10, 0.1), "VALEUR")
                    .appendField("m");
                this.setPreviousStatement(true);
                this.setNextStatement(true);
                this.setColour(180);
                this.setTooltip("Le véhicule recule de la distance indiquée");
            }
        };

        // Bloc : tourner à gauche de X degrés (pas de 45°)
        Blockly.Blocks['tourner_gauche'] = {
            init: function() {
                this.appendDummyInput()
                    .appendField("tourner à gauche de")
                    .appendField(new Blockly.FieldNumber(90, 45, 360, 45), "VALEUR")
                    .appendField("°");
                this.setPreviousStatement(true);
                this.setNextStatement(true);
                this.setColour(200);
                this.setTooltip("Le véhicule pivote à gauche de l'angle indiqué");
            }
        };

        // Bloc : tourner à droite de X degrés (pas de 45°)
        Blockly.Blocks['tourner_droite'] = {
            init: function() {
                this.appendDummyInput()
                    .appendField("tourner à droite de")
                    .appendField(new Blockly.FieldNumber(90, 45, 360, 45), "VALEUR")
                    .appendField("°");
                this.setPreviousStatement(true);
                this.setNextStatement(true);
                this.setColour(200);
                this.setTooltip("Le véhicule pivote à droite de l'angle indiqué");
            }
        };

        // Bloc : allumer un bandeau LED avec un mode
        Blockly.Blocks['led_allumer'] = {
            init: function() {
                this.appendDummyInput()
                    .appendField("allumer bandeau")
                    .appendField(new Blockly.FieldDropdown([
                        ["1", "1"], ["2", "2"]
                    ]), "BANDEAU")
                    .appendField("en mode")
                    .appendField(new Blockly.FieldDropdown([
                        ["gyrophare",  "1"],
                        ["clignotant", "2"],
                        ["phares",     "3"]
                    ]), "MODE");
                this.setPreviousStatement(true);
                this.setNextStatement(true);
                this.setColour(280);
                this.setTooltip("Allume le bandeau LED dans le mode choisi");
            }
        };

        // Bloc : éteindre un bandeau LED
        Blockly.Blocks['led_eteindre'] = {
            init: function() {
                this.appendDummyInput()
                    .appendField("éteindre bandeau")
                    .appendField(new Blockly.FieldDropdown([
                        ["1", "1"], ["2", "2"]
                    ]), "BANDEAU");
                this.setPreviousStatement(true);
                this.setNextStatement(true);
                this.setColour(280);
                this.setTooltip("Éteint le bandeau LED");
            }
        };

        // Bloc : attendre X secondes
        Blockly.Blocks['attendre'] = {
            init: function() {
                this.appendDummyInput()
                    .appendField("attendre")
                    .appendField(new Blockly.FieldNumber(1, 0.1, 60, 0.1), "VALEUR")
                    .appendField("s");
                this.setPreviousStatement(true);
                this.setNextStatement(true);
                this.setColour(40);
                this.setTooltip("Pause avant la commande suivante");
            }
        };

        // Injection de Blockly dans la page
        workspace = Blockly.inject('blocklyDiv', {
            toolbox: document.getElementById('toolbox'),
            scrollbars: true,
            trashcan: true,
            zoom: { controls: true, wheel: false, startScale: 1.0 }
        });
        workspaceInitialise = true;

    } else {
        document.getElementById('blocklyDiv').innerHTML =
            '<p style="padding:20px;color:#b00020;">Blockly non chargé — vérifiez que les fichiers ' +
            'sont bien dans static/libs/blockly/</p>';
    }


    // ----------------------------------------------------------------
    // BLOCKLY — Extraction et exécution de la séquence
    // ----------------------------------------------------------------
    function extraireSequence() {
        const sequence = [];
        if (!workspace) return sequence;

        const topBlocks = workspace.getTopBlocks(true);
        if (topBlocks.length === 0) return sequence;

        // On suit la chaîne de blocs à partir du premier groupe
        let bloc = topBlocks[0];
        while (bloc) {
            switch (bloc.type) {
                case 'avancer':
                    sequence.push({ cmd: 'avancer',
                                    valeur: parseFloat(bloc.getFieldValue('VALEUR')) });
                    break;
                case 'reculer':
                    sequence.push({ cmd: 'reculer',
                                    valeur: parseFloat(bloc.getFieldValue('VALEUR')) });
                    break;
                case 'tourner_gauche':
                    sequence.push({ cmd: 'tourner_gauche',
                                    valeur: parseFloat(bloc.getFieldValue('VALEUR')) });
                    break;
                case 'tourner_droite':
                    sequence.push({ cmd: 'tourner_droite',
                                    valeur: parseFloat(bloc.getFieldValue('VALEUR')) });
                    break;
                case 'led_allumer':
                    sequence.push({ cmd: 'led',
                                    bandeau: parseInt(bloc.getFieldValue('BANDEAU')),
                                    mode:    parseInt(bloc.getFieldValue('MODE')) });
                    break;
                case 'led_eteindre':
                    sequence.push({ cmd: 'led_off',
                                    bandeau: parseInt(bloc.getFieldValue('BANDEAU')) });
                    break;
                case 'attendre':
                    sequence.push({ cmd: 'attendre',
                                    valeur: parseFloat(bloc.getFieldValue('VALEUR')) });
                    break;
            }
            bloc = bloc.getNextBlock();
        }
        return sequence;
    }

    function executerBlocs() {
        const sequence = extraireSequence();
        if (sequence.length === 0) {
            document.getElementById('sequenceStatut').textContent =
                'Aucun bloc — glissez des blocs depuis la barre latérale';
            return;
        }
        socket.emit('executer_sequence', { sequence: sequence });
    }

    function stopSequence() {
        socket.emit('stop_sequence');
    }

    function effacerBlocs() {
        if (workspace) workspace.clear();
        document.getElementById('sequenceStatut').textContent = 'Prêt';
    }

    // Réception du statut d'exécution
    socket.on('sequence_status', (data) => {
        const statut      = document.getElementById('sequenceStatut');
        const btnExecuter = document.getElementById('btnExecuter');
        const btnStop     = document.getElementById('btnStop');

        if (data.etat === 'en_cours') {
            statut.textContent = `${data.index}/${data.total} — ${data.description}`;
            btnExecuter.disabled = true;
            btnStop.disabled     = false;
        } else if (data.etat === 'terminee') {
            statut.textContent = '✓ Séquence terminée';
            btnExecuter.disabled = false;
            btnStop.disabled     = true;
        } else if (data.etat === 'arretee') {
            statut.textContent = '■ Séquence interrompue';
            btnExecuter.disabled = false;
            btnStop.disabled     = true;
        } else if (data.etat === 'erreur') {
            statut.textContent = '⚠ ' + data.description;
            btnExecuter.disabled = false;
            btnStop.disabled     = true;
        }
    });


    // ----------------------------------------------------------------
    // STREAMING VIDÉO
    // ----------------------------------------------------------------
    const videoStream = document.getElementById('videoStream');
    const placeholder = document.getElementById('videoPlaceholder');
    const streamUrl   = `http://${window.location.hostname}:8090/video`;

    function chargerVideo() {
        videoStream.src = streamUrl;
        videoStream.style.display = 'block';
        placeholder.style.display = 'none';
    }

    videoStream.onerror = () => {
        videoStream.style.display = 'none';
        placeholder.style.display = 'flex';
        placeholder.querySelector('.feedback-text').textContent = 'Caméra non disponible';
        setTimeout(chargerVideo, 2000);
    };

    chargerVideo();


    // ----------------------------------------------------------------
    // MODE DE CONDUITE
    // ----------------------------------------------------------------
    const modes   = ["manuel", "semi-autonome", "autonome"];
    let indexMode = 0;

    function changerMode() {
        indexMode = (indexMode + 1) % modes.length;
        const nouveauMode = modes[indexMode];
        socket.emit('changer_mode', { mode: nouveauMode });
        mettreAJourAffichageMode(nouveauMode);
    }

    function mettreAJourAffichageMode(mode) {
        const badge = document.getElementById('modeBadge');
        badge.textContent = mode.toUpperCase().replace('-', '\u2011');
        badge.className   = 'mode-actuel-badge mode-' + mode.replace('-', '');
    }


    // ----------------------------------------------------------------
    // CAMÉRA
    // ----------------------------------------------------------------
    let cameraActive = true;

    function toggleCamera() {
        cameraActive = !cameraActive;
        socket.emit('toggle_camera', { active: cameraActive });
        mettreAJourAffichageCamera(cameraActive);
        if (cameraActive) {
            chargerVideo();
        } else {
            videoStream.src = '';
            videoStream.style.display = 'none';
            placeholder.style.display = 'flex';
            placeholder.querySelector('.feedback-text').textContent = 'Caméra éteinte';
        }
    }

    function mettreAJourAffichageCamera(active) {
        const indicateur = document.getElementById('indicateurCamera');
        const texte      = document.getElementById('texteCamera');
        const btn        = document.getElementById('btnCamera');
        if (active) {
            indicateur.className = 'indicateur-on';
            texte.textContent    = 'Active';
            btn.textContent      = 'Éteindre la caméra';
            btn.className        = 'btn-camera btn-camera-off';
        } else {
            indicateur.className = 'indicateur-off';
            texte.textContent    = 'Éteinte';
            btn.textContent      = 'Allumer la caméra';
            btn.className        = 'btn-camera btn-camera-on';
        }
    }


    // ----------------------------------------------------------------
    // BANDEAUX LED (pilotage manuel)
    // ----------------------------------------------------------------
    const modesLed   = ["ÉTEINT", "GYROPHARE", "CLIGNOTANT", "PHARES"];
    const classesLed = ["mode-led-eteint","mode-led-gyrophare","mode-led-clignotant","mode-led-phares"];
    const ledOn      = { 1: false, 2: false };
    const ledMode    = { 1: 1, 2: 1 };

    function toggleOnoffLed(num) {
        ledOn[num] = !ledOn[num];
        socket.emit(`onoff_led${num}`, { active: ledOn[num] });
        mettreAJourAffichageLed(num, ledOn[num], ledMode[num]);
    }

    function changerModeLed(num) {
        ledMode[num] = (ledMode[num] % 3) + 1;
        socket.emit(`mode_led${num}`, { mode: ledMode[num] });
        mettreAJourAffichageLed(num, ledOn[num], ledMode[num]);
    }

    function mettreAJourAffichageLed(num, active, mode) {
        const indicateur = document.getElementById(`indicateurLed${num}`);
        const texte      = document.getElementById(`texteLed${num}`);
        const btnOnoff   = document.getElementById(`btnOnoffLed${num}`);
        const badge      = document.getElementById(`badgeLed${num}`);

        if (active) {
            indicateur.className = 'indicateur-on';
            texte.textContent    = 'Allumé';
            btnOnoff.textContent = 'Éteindre';
            btnOnoff.className   = 'btn-camera btn-camera-off';
        } else {
            indicateur.className = 'indicateur-off';
            texte.textContent    = 'Éteint';
            btnOnoff.textContent = 'Allumer';
            btnOnoff.className   = 'btn-camera btn-camera-on';
        }

        const modeAff     = mode > 0 ? mode : ledMode[num];
        badge.textContent = modesLed[modeAff];
        badge.className   = `mode-actuel-badge ${classesLed[modeAff]}`;
        ledOn[num]        = active;
        if (mode > 0) ledMode[num] = mode;
    }


    // ----------------------------------------------------------------
    // JOYSTICK VIRTUEL
    // ----------------------------------------------------------------
    const zone             = document.getElementById('joystickZone');
    const poignee          = document.getElementById('joystickPoignee');
    const valeursAffichage = document.getElementById('joystickValeurs');

    let joystickActif = false;
    let centreX = 0, centreY = 0;
    const RAYON_MAX     = 60;
    const INTERVALLE_MS = 50;
    let intervalJoystick = null;
    let dernierX = 0, dernierY = 0;

    function obtenirCentre() {
        const rect = zone.querySelector('.joystick-base').getBoundingClientRect();
        centreX = rect.left + rect.width  / 2;
        centreY = rect.top  + rect.height / 2;
    }

    function calculerPosition(clientX, clientY) {
        let dx = clientX - centreX;
        let dy = clientY - centreY;
        const distance = Math.sqrt(dx * dx + dy * dy);
        if (distance > RAYON_MAX) {
            dx = (dx / distance) * RAYON_MAX;
            dy = (dy / distance) * RAYON_MAX;
        }
        return { dx, dy };
    }

    function mettreAJourPoignee(dx, dy) {
        poignee.style.transform  = `translate(${dx}px, ${dy}px)`;
        dernierX = parseFloat((dx / RAYON_MAX).toFixed(2));
        dernierY = parseFloat((-dy / RAYON_MAX).toFixed(2));
        valeursAffichage.textContent = `x: ${dernierX.toFixed(2)} | y: ${dernierY.toFixed(2)}`;
    }

    function demarrerJoystick(clientX, clientY) {
        joystickActif = true;
        obtenirCentre();
        intervalJoystick = setInterval(() => {
            socket.emit('joystick', { x: dernierX, y: dernierY });
        }, INTERVALLE_MS);
    }

    function deplacerJoystick(clientX, clientY) {
        if (!joystickActif) return;
        const { dx, dy } = calculerPosition(clientX, clientY);
        mettreAJourPoignee(dx, dy);
    }

    function relacherJoystick() {
        if (!joystickActif) return;
        joystickActif = false;
        mettreAJourPoignee(0, 0);
        dernierX = 0; dernierY = 0;
        clearInterval(intervalJoystick);
        socket.emit('joystick', { x: 0, y: 0 });
    }

    zone.addEventListener('mousedown', (e) => { e.preventDefault(); demarrerJoystick(e.clientX, e.clientY); });
    document.addEventListener('mousemove', (e) => deplacerJoystick(e.clientX, e.clientY));
    document.addEventListener('mouseup', relacherJoystick);

    zone.addEventListener('touchstart', (e) => {
        e.preventDefault();
        demarrerJoystick(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });
    document.addEventListener('touchmove', (e) => {
        if (!joystickActif) return;
        e.preventDefault();
        deplacerJoystick(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });
    document.addEventListener('touchend', relacherJoystick);

    </script>
</body>
</html>
